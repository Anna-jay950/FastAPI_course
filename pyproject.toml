[project]
name = "fastapi-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anna-jay950", email = "gamadiannie@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosmtplib>=5.1.3",
    "aiosqlite>=0.22.1",
    "fastapi[standard]>=0.162.2",
    "greenlet>=3.5.6",
    "pillow>=13.0.0",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.1.9",
]

[project.scripts]
fastapi-course = "fastapi_course:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
